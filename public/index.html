<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D4 Страж — Progression Intelligence</title>
  <style>
    :root {
      --bg: #0c0d10;
      --card: #15171e;
      --border: #262936;
      --text: #e6e8f0;
      --muted: #9399ad;
      --accent: #d97706;
    }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.2rem; margin: 0; }
    button { background: var(--accent); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .badges { display: flex; gap: 6px; font-size: 0.7rem; margin-bottom: 6px; }
    .badge { background: #262936; padding: 2px 6px; border-radius: 4px; }
    .title { font-weight: bold; font-size: 1rem; margin-bottom: 4px; }
    .summary { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    .footer { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); align-items: center; }
    a { color: #60a5fa; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>D4 Страж</h1>
      <span style="font-size:0.75rem; color:var(--muted);">Progression Intelligence Dashboard</span>
    </div>
    <button onclick="triggerRefresh()">Обновить</button>
  </header>

  <div id="cards">Загрузка находок...</div>

  <script>
    async function loadIssues() {
      const res = await fetch('/api/issues');
      const items = await res.json();
      const container = document.getElementById('cards');
      
      if (!items.length) {
        container.innerHTML = '<div class="card">Полезных находок пока нет.</div>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="card">
          <div class="badges">
            <span class="badge">${item.category}</span>
            <span class="badge" style="background:#1e3a8a;">${item.content_type}</span>
            <span class="badge" style="background:#065f46;">Польза: ${item.benefit_score}</span>
            <span class="badge">${item.confidence}</span>
          </div>
          <div class="title">${item.title}</div>
          <div class="summary">${item.summary}</div>
          <div class="footer">
            <span>Источник: ${item.source}</span>
            <a href="${item.url}" target="_blank">Открыть ↗</a>
          </div>
        </div>
      `).join('');
    }

    async function triggerRefresh() {
      await fetch('/api/refresh', { method: 'POST' });
      loadIssues();
    }

    loadIssues();
  </script>
</body>
</html>
